<!doctype html>
<html lang="en">
<head>

<body>
  <header><a class="brand" href="/modules">● Pebble</a><span class="badge">Module controls</span><a class="legacy" href="/">Classic controls</a></header>

    <div class="intro"><div><h1>Your robot, its controls.</h1><p>Controls and input mappings supplied by the selected robot.</p></div><div id="connection" role="status">Connecting…</div></div>

    <p id="message" role="status">Waiting for a robot to advertise its modules.</p>

  <footer>Module definitions stay with the robot. Your mapping overrides stay in this browser.</footer>
