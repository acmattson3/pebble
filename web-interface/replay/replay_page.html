<!doctype html>
<meta charset="utf-8">
<title>Pebble Replay Archive</title>
<style>
  :root {
    --bg: #f7f3ea;
    --card: #fffdf8;
    --ink: #28231d;
    --muted: #6e6256;
    --line: #c9beb0;
    --accent: #5b6f4d;
    --accent-soft: #e3eadc;
    --danger: #8c3f3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    border-right: 1px solid var(--line);
    background: #fbf8f1;
    padding: 18px;
    overflow: auto;
  }
  .main {
    padding: 18px;
    overflow: auto;
  }
  h1, h2 {
    margin: 0 0 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto auto auto;
    gap: 10px;
    align-items: end;
    margin-bottom: 16px;
  }
  .session-list, .event-list {
    display: grid;
    gap: 8px;
    margin-top: 10px;
    overflow: auto;
  }
  .session-list {
    max-height: calc(100vh - 260px);
  }
  .event-list {
    max-height: 260px;
  }
  .session-item, .event-item {
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .session-item.active, .event-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .session-item small {
    display: block;
    color: var(--muted);
    margin-top: 4px;
  }
  .event-item {
    display: grid;
    grid-template-columns: 120px 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .event-kind, .subtle, label {
    color: var(--muted);
    font-size: 13px;
  }
  label {
    font-weight: 600;
  }
  .field {
    display: grid;
    gap: 6px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  input[type="datetime-local"], input[type="range"], select, button {
    font: inherit;
  }
  input[type="datetime-local"], select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  input[type="range"] { width: 100%; }
  button {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: #405635;
    color: #fff;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status-line {
    margin-top: 10px;
    min-height: 20px;
  }
  .status-line.error {
    color: var(--danger);
    font-weight: 600;
  }
  .component-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .component-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    background: #f1eee8;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    .toolbar { grid-template-columns: 1fr; }
    .session-list { max-height: 360px; }
  }
</style>

<div class="app">
  <aside class="sidebar">
    <h1>Replay Archive</h1>
    <div class="subtle">Republishes archived MQTT into the <strong>replay</strong> system. Open the main Pebble interface and select system <strong>replay</strong> to view it.</div>
    <div class="status-line" id="discoveryStatus"></div>
    <div class="field" style="margin-top:12px;">
      <label for="sessionSearchTime">Search Time</label>
      <input id="sessionSearchTime" type="datetime-local" step="0.001">
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="refreshSessions">Refresh Sessions</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="card field">
        <label for="currentTime">Current Time</label>
        <input id="currentTime" type="datetime-local" step="0.001">
      </div>
      <div class="card field">
        <label for="sourceSystem">Source System</label>
        <select id="sourceSystem"></select>
      </div>
      <div class="card field">
        <label>Session</label>
        <div id="currentSessionLabel" class="subtle">No session selected</div>
      </div>
      <div class="card field">
        <label>Navigation</label>
        <div class="row">
          <button id="prevSession">Prev</button>
          <button id="nextSession">Next</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="row" style="justify-content:space-between;">
        <h2>Transport</h2>
        <div class="row">
          <button id="republishToggle" class="primary">Start Replay</button>
        </div>
      </div>
      <input id="timelineBar" type="range" min="0" max="0" value="0" step="0.1">
      <div class="subtle" id="timelineHint">Select a session to begin.</div>
      <div class="status-line" id="republishStatus"></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>Components</h2>
      <div class="component-filter" id="componentFilters"></div>
    </div>

    <div class="card">
      <h2>Events</h2>
      <div class="event-list" id="sessionEvents"></div>
    </div>
  </main>
</div>

<script>
const state = {
  sessions: [],
  selectedSessionId: null,
  selectedSession: null,
  selectedSystem: "",
  currentTimeMs: null,
  playing: false,
  playTimer: null,
  selectedComponents: new Set(),
  sessionEvents: [],
  sessionSearchBeforeIso: null,
  republishing: false,
  republishSessionId: null,
};

function toLocalInputValue(isoString) {
  const date = new Date(isoString);
  const pad = (value, width = 2) => String(value).padStart(width, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.${pad(date.getMilliseconds(), 3)}`;
}

function formatTimestamp(ms) {
  return new Date(ms).toLocaleString();
}

function formatDuration(seconds) {
  const s = Math.max(0, Math.round(seconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const rem = s % 60;
  if (h > 0) return `${h}h ${m}m ${rem}s`;
  if (m > 0) return `${m}m ${rem}s`;
  return `${rem}s`;
}

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data.description || data.error || `Request failed: ${res.status}`);
  }
  return data;
}

function setDiscoveryStatus(text, isError = false) {
  const el = document.getElementById("discoveryStatus");
  el.textContent = text;
  el.className = isError ? "status-line error" : "status-line subtle";
}

function componentLabel(componentId) {
  const found = (state.selectedSession?.components || []).find(item => item.id === componentId);
  return found ? `${found.type || "robots"}/${componentId}` : componentId;
}

function sessionSystems(session) {
  const systems = Array.isArray(session?.sourceSystems) ? session.sourceSystems.filter(Boolean) : [];
  return systems.length ? systems : ["pebble"];
}

function sessionById(id) {
  return state.sessions.find(item => item.id === id) || null;
}

function setPlaybackButtons() {
  const republish = document.getElementById("republishToggle");
  republish.textContent = state.republishing ? "Stop Replay" : "Start Replay";
  republish.disabled = !state.selectedSession;
}

function renderRepublishStatus(status = null) {
  const el = document.getElementById("republishStatus");
  if (!status && !state.republishing) {
    el.textContent = "Republish idle.";
    return;
  }
  if (status?.error) {
    el.textContent = `Republish error: ${status.error}`;
    el.className = "status-line error";
    return;
  }
  el.className = "status-line subtle";
  if (state.republishing) {
    const count = Number(status?.published || 0);
    const last = status?.lastTopic ? ` Last: ${status.lastTopic}` : "";
    el.textContent = `Republishing ${state.selectedSystem || status?.sourceSystem || ""} -> replay. Published ${count}.${last}`;
  } else {
    el.textContent = "Republish idle.";
  }
}

async function startDiscovery() {
  try {
    const data = await fetchJson("/replay/api/discovery/start", { method: "POST" });
    setDiscoveryStatus(data.started ? "Discovering sessions in background..." : "Discovery already running.");
  } catch (err) {
    setDiscoveryStatus(String(err), true);
  }
}

async function refreshDiscoveryStatus() {
  try {
    const data = await fetchJson("/replay/api/discovery/status");
    if (data.running) setDiscoveryStatus("Discovering sessions in background...");
    else if (data.error) setDiscoveryStatus(`Discovery error: ${data.error}`, true);
    else if (data.lastScannedTs) setDiscoveryStatus(`Archive scanned through ${new Date(data.lastScannedTs).toLocaleString()}`);
    else setDiscoveryStatus("Replay discovery idle.");
  } catch (err) {
    setDiscoveryStatus(String(err), true);
  }
}

async function refreshRepublishStatus() {
  try {
    const data = await fetchJson("/replay/api/republish/status");
    const wasRepublishing = state.republishing;
    state.republishing = Boolean(data.running);
    state.republishSessionId = data.sessionId || null;
    if (wasRepublishing && !state.republishing && state.playing) {
      stopLocalClock();
    }
    renderRepublishStatus(data);
  } catch (_err) {
    state.republishing = false;
    state.republishSessionId = null;
    renderRepublishStatus();
  }
  setPlaybackButtons();
}

function renderSessions() {
  const list = document.getElementById("sessionList");
  list.innerHTML = "";
  for (const session of state.sessions) {
    const btn = document.createElement("button");
    btn.className = `session-item${session.id === state.selectedSessionId ? " active" : ""}`;
    btn.innerHTML = `
      <strong>${new Date(session.startTs).toLocaleString()}</strong>
      <small>Duration ${formatDuration(session.durationS)} | ${session.componentIds.length} components | ${session.eventCount} events | ${sessionSystems(session).join(", ")}</small>
      <div class="subtle">${Object.entries(session.activityCounts || {}).map(([k,v]) => `${k}:${v}`).join(" | ") || "No summary"}</div>
    `;
    btn.addEventListener("click", () => selectSession(session.id).catch(console.error));
    list.appendChild(btn);
  }
}

function renderSystemOptions() {
  const select = document.getElementById("sourceSystem");
  select.innerHTML = "";
  const systems = sessionSystems(state.selectedSession);
  for (const system of systems) {
    const option = document.createElement("option");
    option.value = system;
    option.textContent = system;
    select.appendChild(option);
  }
  if (!systems.includes(state.selectedSystem)) state.selectedSystem = systems[0] || "";
  select.value = state.selectedSystem;
  select.disabled = !state.selectedSession || systems.length <= 1;
}

function renderComponentFilters() {
  const container = document.getElementById("componentFilters");
  container.innerHTML = "";
  if (!state.selectedSession) return;
  for (const componentId of state.selectedSession.componentIds || []) {
    const label = document.createElement("label");
    label.className = "component-pill";
    const checked = state.selectedComponents.has(componentId);
    label.innerHTML = `<input type="checkbox" ${checked ? "checked" : ""}> <span>${componentLabel(componentId)}</span>`;
    label.querySelector("input").addEventListener("change", (event) => {
      if (event.target.checked) state.selectedComponents.add(componentId);
      else state.selectedComponents.delete(componentId);
    });
    container.appendChild(label);
  }
}

function renderSessionEvents() {
  const container = document.getElementById("sessionEvents");
  container.innerHTML = "";
  if (!state.selectedSession) {
    container.innerHTML = `<div class="subtle">Select a session to see events.</div>`;
    return;
  }
  if (!state.sessionEvents.length) {
    container.innerHTML = `<div class="subtle">No major events in this session.</div>`;
    return;
  }
  for (const event of state.sessionEvents) {
    const tsMs = new Date(event.ts).getTime();
    const btn = document.createElement("button");
    btn.className = `event-item${Math.abs((state.currentTimeMs || 0) - tsMs) < 500 ? " active" : ""}`;
    btn.innerHTML = `
      <span>${new Date(tsMs).toLocaleTimeString()}</span>
      <span>${event.label || event.topic || "event"}</span>
      <span class="event-kind">${event.kind || ""}</span>
    `;
    btn.addEventListener("click", () => seekTo(tsMs));
    container.appendChild(btn);
  }
}

async function loadSessionEvents() {
  state.sessionEvents = [];
  renderSessionEvents();
  if (!state.selectedSession) return;
  const data = await fetchJson(`/replay/api/session/${state.selectedSession.id}/events`);
  state.sessionEvents = data.events || [];
  renderSessionEvents();
}

function updateTimeInputs() {
  if (!state.selectedSession || state.currentTimeMs == null) return;
  document.getElementById("currentTime").value = toLocalInputValue(new Date(state.currentTimeMs).toISOString());
  const startMs = new Date(state.selectedSession.startTs).getTime();
  const endMs = new Date(state.selectedSession.endTs).getTime();
  const slider = document.getElementById("timelineBar");
  slider.min = String(startMs);
  slider.max = String(endMs);
  slider.value = String(state.currentTimeMs);
  document.getElementById("timelineHint").textContent = `${formatTimestamp(state.currentTimeMs)} of session ${formatDuration(state.selectedSession.durationS)}`;
  renderSessionEvents();
}

function clampCurrentTime() {
  if (!state.selectedSession) return;
  const startMs = new Date(state.selectedSession.startTs).getTime();
  const endMs = new Date(state.selectedSession.endTs).getTime();
  if (state.currentTimeMs == null) state.currentTimeMs = startMs;
  state.currentTimeMs = Math.max(startMs, Math.min(endMs, state.currentTimeMs));
}

async function stopRepublishLocal() {
  if (!state.republishing || !state.selectedSession) return;
  await fetchJson(`/replay/api/session/${state.selectedSession.id}/republish`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: "stop"}),
  });
  state.republishing = false;
  state.republishSessionId = null;
  setPlaybackButtons();
  renderRepublishStatus();
}

function stopLocalClock() {
  state.playing = false;
  if (state.playTimer) {
    clearInterval(state.playTimer);
    state.playTimer = null;
  }
  setPlaybackButtons();
}

async function stopPlayback() {
  stopLocalClock();
  await stopRepublishLocal();
}

function seekTo(tsMs) {
  stopPlayback().catch(console.error);
  state.currentTimeMs = tsMs;
  clampCurrentTime();
  updateTimeInputs();
}

function startLocalClock() {
  if (!state.selectedSession || state.currentTimeMs == null) return;
  state.playing = true;
  setPlaybackButtons();
  state.playTimer = setInterval(() => {
    if (!state.playing || !state.selectedSession) return;
    state.currentTimeMs += 250;
    const endMs = new Date(state.selectedSession.endTs).getTime();
    if (state.currentTimeMs >= endMs) {
      state.currentTimeMs = endMs;
      updateTimeInputs();
      stopPlayback().catch(console.error);
      return;
    }
    updateTimeInputs();
  }, 250);
}

async function toggleRepublish() {
  if (!state.selectedSession || state.currentTimeMs == null) return;
  if (state.republishing) {
    await stopPlayback();
    await refreshRepublishStatus();
    return;
  }
  await fetchJson(`/replay/api/session/${state.selectedSession.id}/republish`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      action: "start",
      at: new Date(state.currentTimeMs).toISOString(),
      system: state.selectedSystem,
      components: Array.from(state.selectedComponents),
    }),
  });
  startLocalClock();
  await refreshRepublishStatus();
}

async function loadSessions() {
  const params = new URLSearchParams({ limit: "20" });
  if (state.sessionSearchBeforeIso) params.set("before", state.sessionSearchBeforeIso);
  const data = await fetchJson(`/replay/api/sessions?${params.toString()}`);
  state.sessions = data.sessions || [];
  renderSessions();
  if (!state.selectedSessionId && state.sessions.length > 0) {
    await selectSession(state.sessions[0].id);
  }
}

async function selectSession(sessionId) {
  await stopPlayback();
  state.selectedSessionId = sessionId;
  state.selectedSession = sessionById(sessionId);
  renderSessions();
  if (!state.selectedSession) return;
  document.getElementById("currentSessionLabel").textContent = `${new Date(state.selectedSession.startTs).toLocaleString()} | ${formatDuration(state.selectedSession.durationS)}`;
  state.selectedComponents = new Set(state.selectedSession.componentIds || []);
  state.currentTimeMs = new Date(state.selectedSession.startTs).getTime();
  state.selectedSystem = sessionSystems(state.selectedSession)[0] || "";
  renderSystemOptions();
  renderComponentFilters();
  updateTimeInputs();
  await loadSessionEvents();
}

document.getElementById("refreshSessions").addEventListener("click", () => loadSessions().catch(err => setDiscoveryStatus(String(err), true)));
document.getElementById("sourceSystem").addEventListener("change", (event) => {
  stopPlayback().catch(console.error);
  state.selectedSystem = event.target.value || "";
  renderSystemOptions();
});
document.getElementById("sessionSearchTime").addEventListener("change", async (event) => {
  await stopPlayback();
  const value = event.target.value;
  state.sessionSearchBeforeIso = value ? new Date(value).toISOString() : null;
  state.selectedSessionId = null;
  state.selectedSession = null;
  await loadSessions();
});
document.getElementById("prevSession").addEventListener("click", async () => {
  if (!state.selectedSessionId) return;
  const index = state.sessions.findIndex(item => item.id === state.selectedSessionId);
  if (index >= 0 && index < state.sessions.length - 1) await selectSession(state.sessions[index + 1].id);
});
document.getElementById("nextSession").addEventListener("click", async () => {
  if (!state.selectedSessionId) return;
  const index = state.sessions.findIndex(item => item.id === state.selectedSessionId);
  if (index > 0) await selectSession(state.sessions[index - 1].id);
});
document.getElementById("republishToggle").addEventListener("click", () => toggleRepublish().catch(err => setDiscoveryStatus(String(err), true)));
document.getElementById("currentTime").addEventListener("change", async (event) => {
  if (!state.selectedSession) return;
  const value = event.target.value;
  if (!value) return;
  seekTo(new Date(value).getTime());
});
document.getElementById("timelineBar").addEventListener("change", async (event) => {
  seekTo(Number(event.target.value));
});

(async function init() {
  try { await startDiscovery(); } catch (err) { console.error(err); }
  try { await refreshDiscoveryStatus(); } catch (err) { console.error(err); }
  try { await refreshRepublishStatus(); } catch (err) { console.error(err); }
  document.getElementById("sessionSearchTime").value = toLocalInputValue(new Date().toISOString());
  state.sessionSearchBeforeIso = new Date().toISOString();
  try { await loadSessions(); } catch (err) {
    console.error(err);
    setDiscoveryStatus(String(err), true);
  }
  setInterval(() => refreshDiscoveryStatus().catch(console.error), 3000);
  setInterval(() => refreshRepublishStatus().catch(console.error), 3000);
  setInterval(() => loadSessions().catch(console.error), 5000);
})();
</script>
